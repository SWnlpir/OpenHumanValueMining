[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-human-value-mining"
version = "0.2.0"
description = "Argument extraction, value decomposition and consensus clustering"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.0", "python-dotenv>=1.0"]
cluster = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]
embeddings = ["sentence-transformers>=2.7"]
all = [
    "openai>=1.0", "python-dotenv>=1.0", "numpy>=1.24", "pandas>=2.0",
    "scipy>=1.10", "scikit-learn>=1.3", "sentence-transformers>=2.7",
]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
ohvm = "pipeline:entrypoint"

[project.urls]
Repository = "https://github.com/SWnlpir/OpenHumanValueMining"

[tool.setuptools]
py-modules = [
    "pipeline", "ohvm_runtime", "argument_tree_extraction", "value_decomposition",
    "consensus_clustering", "cluster_evidence_selection", "evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
